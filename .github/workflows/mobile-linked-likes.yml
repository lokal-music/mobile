name: Mobile linked liked-songs regression
on:
  pull_request:
    paths:
      - 'lib/services/link/link_journal.dart'
      - 'lib/services/link/link_sync_coordinator.dart'
      - 'lib/services/link/link_favorite_snapshot.dart'
      - 'lib/services/favorites_service.dart'
      - 'test/services/link/link_favorite_snapshot_test.dart'
      - '.github/workflows/mobile-linked-likes.yml'
  push:
    branches: [main]
    paths:
      - 'lib/services/link/link_journal.dart'
      - 'lib/services/link/link_sync_coordinator.dart'
      - 'lib/services/link/link_favorite_snapshot.dart'
      - 'lib/services/favorites_service.dart'
      - 'test/services/link/link_favorite_snapshot_test.dart'
      - '.github/workflows/mobile-linked-likes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-likes:
    name: Verify mobile-to-desktop likes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze linked likes and saved favorites
        run: >-
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          lib/services/link/link_favorite_snapshot.dart
          lib/services/link/link_journal.dart
          lib/services/link/link_sync_coordinator.dart
          lib/services/favorites_service.dart
      - name: Verify online-only favorites, mobile catalogue publishing and sync metadata
        run: >-
          flutter test --no-pub
          test/services/link/link_favorite_snapshot_test.dart
          test/services/link/mobile_catalog_publish_test.dart
          test/services/online_favorites_test.dart
      - run: git diff --exit-code -- pubspec.lock
