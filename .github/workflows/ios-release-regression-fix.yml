name: iOS release regression fix
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'lib/features/konnekted/library/artist_follow_store.dart'
      - 'lib/features/konnekted/library/lokal_albums_artists.dart'
      - 'lib/services/player_volume_control.dart'
      - 'test/spotify/artist_follow_link_test.dart'
      - 'test/konnekted/tablet_player_sidebar_test.dart'
      - '.github/workflows/ios-release-regression-fix.yml'
  push:
    branches: [main]
    paths: ['.github/workflows/ios-release-regression-fix.yml']
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify artist favorites, tablet volume and volume routing
        run: >-
          flutter test --no-pub
          test/spotify/artist_follow_link_test.dart
          test/konnekted/tablet_player_sidebar_test.dart
          test/services/player_volume_control_test.dart
      - run: git diff --exit-code -- pubspec.lock
  rebuild:
    needs: regressions
    # Dispatch only the explicitly marked, merged correction. Ordinary PRs
    # and future workflow edits cannot start releases. No checkout in this job.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[rebuild-ios-regressions]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start fresh Android and iOS release builds from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run ios-ci.yml --ref main -f bump=patch -f publish=true -f native_acceptance=false -f live_video_probe=false
          gh workflow run android-release.yml --ref main -f bump=patch -f flavor=full -f replace_existing=false -f draft=false
