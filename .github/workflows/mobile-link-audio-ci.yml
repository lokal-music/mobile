name: Mobile Link audio streaming

on:
  pull_request:
    paths:
      - 'lib/services/link/link_audio_server.dart'
      - 'lib/providers/lokal_remote_provider.dart'
      - 'test/services/link/link_audio_server_test.dart'
      - '.github/workflows/mobile-link-audio-ci.yml'

permissions:
  contents: read

jobs:
  audio-stream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: |
          dart format lib/services/link/link_audio_server.dart lib/providers/lokal_remote_provider.dart test/services/link/link_audio_server_test.dart
          git diff -- lib/services/link/link_audio_server.dart lib/providers/lokal_remote_provider.dart test/services/link/link_audio_server_test.dart
      - name: Analyze Link audio implementation
        run: flutter analyze lib/services/link/link_audio_server.dart lib/providers/lokal_remote_provider.dart
      - name: Test authenticated token and HTTP range behavior
        run: flutter test test/services/link/link_audio_server_test.dart
